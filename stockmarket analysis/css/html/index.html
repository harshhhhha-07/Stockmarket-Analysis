<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockSense — Professional Trading Dashboard</title>
    <meta name="description"
        content="Premium stock market dashboard with real-time charts, technical indicators, intraday scanner and portfolio tracker for Indian equities." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="../styles.css" />

    <!-- React 18 via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Recharts via CDN -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
</head>

<body>
    <div id="root">
        <!-- Loading skeleton -->
        <div
            style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;background:#0a0e17;">
            <div style="font-size:40px">📈</div>
            <div style="font-size:20px;font-weight:800;color:#e2e8f0;font-family:Inter,sans-serif">StockSense</div>
            <div style="display:flex;gap:6px;">
                <div
                    style="width:8px;height:8px;border-radius:50%;background:#6366f1;animation:pulse 1s ease infinite 0s">
                </div>
                <div
                    style="width:8px;height:8px;border-radius:50%;background:#6366f1;animation:pulse 1s ease infinite 0.2s">
                </div>
                <div
                    style="width:8px;height:8px;border-radius:50%;background:#6366f1;animation:pulse 1s ease infinite 0.4s">
                </div>
            </div>
        </div>
    </div>

    <!-- Mock Data -->
    <script src="../../js/data.js"></script>
    <!-- Chart Components -->
    <script src="../../js/charts.js"></script>
    <!-- Shared Components -->
    <script src="../../js/components.js"></script>
    <!-- Page Components -->
    <script src="../../js/pages.js"></script>
    <!-- Root App -->
    <script src="../../js/app.js"></script>
</body>

</html>
